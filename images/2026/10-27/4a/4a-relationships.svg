<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img"><title>4A 架构：业务、数据、应用与技术协同</title><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#6c839e" stroke-width="1.6"/></marker></defs><rect width="1600" height="1180" rx="28" fill="#f4f8fd"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="70" y="90" fill="#18324f" font-size="43" font-weight="700" text-anchor="start">4A 架构：职责与协同关系</text><text x="72" y="137" fill="#526b85" font-size="25" font-weight="400" text-anchor="start">业务目标、数据权责、应用职责与技术机制的跨域一致性</text><rect x="470" y="190" width="660" height="170" rx="24" fill="#e5efff" stroke="#d5e0ec" stroke-width="2"/><text x="800" y="243" fill="#18324f" font-size="34" font-weight="700" text-anchor="middle">BA · 业务架构</text><text x="800" y="293" fill="#526b85" font-size="27" font-weight="400" text-anchor="middle">业务目标 · 能力 · 角色 · 流程</text><text x="800" y="332" fill="#526b85" font-size="25" font-weight="400" text-anchor="middle">业务对象 · 规则 · 例外处理</text><rect x="85" y="505" width="600" height="230" rx="24" fill="#e3f4ee" stroke="#d5e0ec" stroke-width="2"/><rect x="915" y="505" width="600" height="230" rx="24" fill="#f0eaff" stroke="#d5e0ec" stroke-width="2"/><text x="385" y="564" fill="#18324f" font-size="34" font-weight="700" text-anchor="middle">DA · 数据架构</text><text x="385" y="612" fill="#526b85" font-size="25" font-weight="400" text-anchor="middle">语义与模型 · 权威来源 · 写入责任</text><text x="385" y="655" fill="#526b85" font-size="25" font-weight="400" text-anchor="middle">数据流动 · 一致性 · 生命周期</text><text x="385" y="700" fill="#526b85" font-size="23" font-weight="400" text-anchor="middle">数据语义 · 权威范围 · 治理责任</text><text x="1215" y="564" fill="#18324f" font-size="34" font-weight="700" text-anchor="middle">AA · 应用架构</text><text x="1215" y="612" fill="#526b85" font-size="25" font-weight="400" text-anchor="middle">应用职责 · 组件边界 · 协作方式</text><text x="1215" y="655" fill="#526b85" font-size="25" font-weight="400" text-anchor="middle">API / 事件 · 错误与兼容契约</text><text x="1215" y="700" fill="#526b85" font-size="23" font-weight="400" text-anchor="middle">能力分配 · 交互协议 · 契约治理</text><rect x="470" y="895" width="660" height="170" rx="24" fill="#fff0df" stroke="#d5e0ec" stroke-width="2"/><text x="800" y="949" fill="#18324f" font-size="34" font-weight="700" text-anchor="middle">TA · 技术架构</text><text x="800" y="997" fill="#526b85" font-size="26" font-weight="400" text-anchor="middle">平台 · 存储 · 网络 · 中间件 · 运维</text><text x="800" y="1036" fill="#526b85" font-size="25" font-weight="400" text-anchor="middle">性能 · 可用性 · 安全 · 恢复 · 成本</text><path d="M590 360V430H385V495" fill="none" stroke="#6c839e" stroke-width="3" marker-end="url(#a)"/><text x="400" y="410" fill="#526b85" font-size="24" font-weight="400" text-anchor="start">信息与规则</text><path d="M1010 360V430H1215V495" fill="none" stroke="#6c839e" stroke-width="3" marker-end="url(#a)"/><text x="1085" y="410" fill="#526b85" font-size="24" font-weight="400" text-anchor="start">能力与流程</text><path d="M700 620H900" fill="none" stroke="#6c839e" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/><text x="800" y="574" fill="#526b85" font-size="22" font-weight="400" text-anchor="middle">协同约束</text><text x="800" y="605" fill="#526b85" font-size="22" font-weight="400" text-anchor="middle">数据与行为归属</text><path d="M590 895V815H385V745" fill="none" stroke="#6c839e" stroke-width="3" marker-end="url(#a)"/><text x="398" y="801" fill="#526b85" font-size="24" font-weight="400" text-anchor="start">数据运行支撑</text><path d="M1010 895V815H1215V745" fill="none" stroke="#6c839e" stroke-width="3" marker-end="url(#a)"/><text x="1020" y="850" fill="#526b85" font-size="24" font-weight="400" text-anchor="start">应用运行支撑</text><path d="M1515 620H1550V275H1145" fill="none" stroke="#6c839e" stroke-width="3" marker-end="url(#a)" stroke-dasharray="8 8"/><rect x="1285" y="358" w