<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title"><title id="title">模型调用的四类上下文组成</title><metadata></metadata><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf4fb"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8298ab"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#244563" flood-opacity=".06"/></filter></defs><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="1200" height="710" rx="24" fill="url(#bg)" /><text x="48" y="66" font-size="33" fill="#19354e" font-weight="700" text-anchor="start">一次模型调用的上下文组成</text><text x="48" y="108" font-size="21" fill="#61798d" font-weight="400" text-anchor="start">区分规则、历史、当前问题与附加资料，按当前任务组织输入</text><rect x="48" y="150" width="528" height="190" rx="18" fill="#e8f0fc" /><text x="72" y="191" font-size="19" fill="#3d73b7" font-weight="650" text-anchor="start">01</text><text x="122" y="193" font-size="26" fill="#19354e" font-weight="650" text-anchor="start">系统提示词</text><text x="72" y="248" font-size="22" fill="#19354e" font-weight="400" text-anchor="start">行为规则 · 任务边界 · 输出要求</text><text x="72" y="298" font-size="19" fill="#61798d" font-weight="400" text-anchor="start">稳定规则与普通资料保持边界</text><rect x="624" y="150" width="528" height="190" rx="18" fill="#e6f7f2" /><text x="648" y="191" font-size="19" fill="#138a78" font-weight="650" text-anchor="start">02</text><text x="698" y="193" font-size="26" fill="#19354e" font-weight="650" text-anchor="start">对话历史</text><text x="648" y="248" font-size="22" fill="#19354e" font-weight="400" text-anchor="start">最近完整交互 · 必要任务进展</text><text x="648" y="298" font-size="19" fill="#61798d" font-weight="400" text-anchor="start">历史存储不等于每次全量发送</text><rect x="48" y="368" width="528" height="190" rx="18" fill="#fff2df" /><text x="72" y="409" font-size="19" fill="#bd7c21" font-weight="650" text-anchor="start">03</text><text x="122" y="411" font-size="26" fill="#19354e" font-weight="650" text-anchor="start">当前用户输入</text><text x="72" y="466" font-size="22" fill="#19354e" font-weight="400" text-anchor="start">本轮问题 · 新增条件 · 修改要求</text><text x="72" y="516" font-size="19" fill="#61798d" font-weight="400" text-anchor="start">识别哪些新要求替代了旧要求</text><rect x="624" y="368" width="528" height="190" rx="18" fill="#eeeafb" /><text x="648" y="409" font-size="19" fill="#7e61bd" font-weight="650" text-anchor="start">04</text><text x="698" y="411" font-size="26" fill="#19354e" font-weight="650" text-anchor="start">附加上下文</text><text x="648" y="466" font-size="22" fill="#19354e" font-weight="400" text-anchor="start">工具定义与结果 · 检索片段 · 多模态</text><text x="648" y="516" font-size="19" fill="#61798d" font-weight="400" text-anchor="start">保留必要标识、版本与查询时间</text><rect x="48" y="590" width="1104" height="88" rx="16" fill="#e6eff9" /><text x="72" y="626" font-size="21" fill="#19354e" font-weight="600" text-anchor="start">当前上下文是本次调用可用的信息，不是模型之外全部文件或数据库内容。</text><text x="72" y="658" font-size="18" fill="#61798d" font-weight="400" text-anchor="start">逻辑组成示意；不同接口的消息角色、序列化方式与计量规则可能不同。</text></g></svg>