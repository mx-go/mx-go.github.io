<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title"><title id="title">滑动窗口、摘要合并与重要信息固定对比</title><metadata></metadata><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf4fb"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8298ab"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#244563" flood-opacity=".06"/></filter></defs><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="1200" height="790" rx="24" fill="url(#bg)" /><text x="48" y="66" font-size="33" fill="#19354e" font-weight="700" text-anchor="start">对话历史管理：保留什么，替换什么</text><text x="48" y="108" font-size="21" fill="#61798d" font-weight="400" text-anchor="start">同一段历史可以采用不同组织方式；实际应按 Token 预算保留完整交互</text><rect x="48" y="150" width="1104" height="168" rx="16" fill="#ffffff" filter="url(#shadow)"/><text x="72" y="188" font-size="25" fill="#19354e" font-weight="650" text-anchor="start">滑动窗口</text><text x="330" y="188" font-size="20" fill="#61798d" font-weight="400" text-anchor="start">移除较早历史，保留最近交互</text><rect x="48" y="346" width="1104" height="168" rx="16" fill="#ffffff" filter="url(#shadow)"/><text x="72" y="384" font-size="25" fill="#19354e" font-weight="650" text-anchor="start">摘要合并</text><text x="330" y="384" font-size="20" fill="#61798d" font-weight="400" text-anchor="start">将早期过程压缩为摘要，保留最近交互</text><rect x="48" y="542" width="1104" height="168" rx="16" fill="#ffffff" filter="url(#shadow)"/><text x="72" y="580" font-size="25" fill="#19354e" font-weight="650" text-anchor="start">重要信息固定</text><text x="330" y="580" font-size="20" fill="#61798d" font-weight="400" text-anchor="start">独立维护目标、约束和标识，再携带必要历史</text><rect x="76" y="218" width="130" height="51" rx="9" fill="#eef1f5" /><text x="141.0" y="251" font-size="21" fill="#9ca9b5" font-weight="600" text-anchor="middle">第 1 轮</text><rect x="227" y="218" width="130" height="51" rx="9" fill="#eef1f5" /><text x="292.0" y="251" font-size="21" fill="#9ca9b5" font-weight="600" text-anchor="middle">第 2 轮</text><rect x="378" y="218" width="130" height="51" rx="9" fill="#eef1f5" /><text x="443.0" y="251" font-size="21" fill="#9ca9b5" font-weight="600" text-anchor="middle">第 3 轮</text><rect x="529" y="218" width="130" height="51" rx="9" fill="#e7f0fb" /><text x="594.0" y="251" font-size="21" fill="#19354e" font-weight="600" text-anchor="middle">第 4 轮</text><rect x="680" y="218" width="130" height="51" rx="9" fill="#e7f0fb" /><text x="745.0" y="251" font-size="21" fill="#19354e" font-weight="600" text-anchor="middle">第 5 轮</text><rect x="831" y="218" width="130" height="51" rx="9" fill="#e7f0fb" /><text x="896.0" y="251" font-size="21" fill="#19354e" font-weight="600" text-anchor="middle">第 6 轮</text><rect x="982" y="218" width="130" height="51" rx="9" fill="#e7f0fb" /><text x="1047.0" y="251" font-size="21" fill="#19354e" font-weight="600" text-anchor="middle">第 7 轮</text><text x="76" y="300" font-size="17" fill="#7c8fa0" font-weight="400" text-anchor="start">前 3 轮移出当前请求</text><text x="529" y="300" font-size="17" fill="#3d73b7" font-weight="400" text-anchor="start">最近 4 轮完整交互</text><rect x="76" y="415" width="435" height="51" rx="9" fill="#e6f7f2" /><text x="293.5" y="448" font-size="21" fill="#19354e" font-weight="600" text-anchor="middle">早期 1—4 轮摘要</text><rect x="550" y="415" width="170" height="51" rx="9" fill="#e7f0fb" /><text x="635.0" y="448" font-size="21" fill="#19354e" font-weight="600" text-anchor="middle">第 5 轮</text><rect x="745" y="415" width="170" height="51" rx="9" fill="#e7f0fb" /><text x="830.0" y="448" font-size="21" fill="#19354e" font-weight="600" text-anchor="middle">第 6 轮</text><rect x="940" y="415" width="170" height="51" rx="9" fill="#e7f0fb" /><text x="1025.0" y="448" font-size="21" fill="#19354e" font-weight="600" text-anchor="middle">第 7 轮</text><text x="76" y="497" font-size="18" fill="#61798d" font-weight="400" text-anchor="start">摘要保留关键结论与证据，原始记录可用于核查</text><rect x="76" y="611" width="435" height="51" rx="9" fill="#fff2df" /><text x="293.5" y="644" font-size="21" fill="#19354e" font-weight="600" text-anchor="middle">固定：目标 · 约束 · 标识</text><rect x="550" y="611" width="170" height="51" rx="9" fill="#e7f0fb" /><text x="635.0" y="644" font-size="21" fill="#19354e" font-weight="600" text-anchor="middle">最近交互 1</text><rect x="745" y="611" width="170" height="51" rx="9" fill="#e7f0fb" /><text x="830.0" y="644" font-size="21" fill="#19354e" font-weight="600" text-anchor="middle">最近交互 2</text><rect x="940" y="611" width="170" height="51" rx="9" fill="#e7f0fb" /><text x="1025.0" y="644" font-size="21" fill="#19354e" font-weight="600" text-anchor="middle">最近交互 3</text><text x="76" y="693" font-size="18" fill="#61798d" font-weight="400" text-anchor="start">固定状态随任务更新，不代表永久有效或拥有更高指令权限</text><text x="48" y="757" font-size="19" fill="#61798d" font-weight="400" text-anchor="start">三种方式可以组合使用；图中轮数仅为示意，不是统一推荐配置。</text></g></svg>