<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc"><title id="title">提示词要素与消息角色是两个维度</title><desc id="desc">左侧是内容要素，右侧是消息身份。System、Developer、User是特定指令体系的层级，Assistant和Tool另表回复与数据。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fafcff" /><stop offset="1" stop-color="#edf4fb" /></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#234363" flood-opacity=".07" /></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#6c8aa5" stroke-width="1.6" /></marker></defs><rect width="1440" height="1120" rx="28" fill="url(#bg)" /><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="82" fill="#18334f" font-size="44" font-weight="700" text-anchor="start">内容要素 ≠ 消息角色</text><text x="60" y="130" fill="#698098" font-size="23" font-weight="400" text-anchor="start">同一种内容可以出现在不同消息中；正文中的身份描述不会改变外层 role。</text><rect x="60" y="178" width="620" height="800" rx="22" fill="#fff" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)" /><rect x="760" y="178" width="620" height="800" rx="22" fill="#fff" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)" /><text x="92" y="235" fill="#397ad1" font-size="30" font-weight="700" text-anchor="start">内容维度：应该表达什么</text><text x="94" y="295" fill="#18334f" font-size="24" font-weight="600" text-anchor="start">角色定位</text><text x="94" y="327" fill="#698098" font-size="22" font-weight="400" text-anchor="start">你是 Java 代码审查助手</text><text x="94" y="385" fill="#18334f" font-size="24" font-weight="600" text-anchor="start">任务指令</text><text x="94" y="417" fill="#698098" font-size="22" font-weight="400" text-anchor="start">检查事务边界</text><text x="94" y="475" fill="#18334f" font-size="24" font-weight="600" text-anchor="start">上下文</text><text x="94" y="507" fill="#698098" font-size="22" font-weight="400" text-anchor="start">Spring 代理与调用方式</text><text x="94" y="565" fill="#18334f" font-size="24" font-weight="600" text-anchor="start">输入数据</text><text x="94" y="597" fill="#698098" font-size="22" font-weight="400" text-anchor="start">待审查代码</text><text x="94" y="655" fill="#18334f" font-size="24" font-weight="600" text-anchor="start">约束</text><text x="94" y="687" fill="#698098" font-size="22" font-weight="400" text-anchor="start">没有证据不下结论</text><text x="94" y="745" fill="#18334f" font-size="24" font-weight="600" text-anchor="start">输出要求</text><text x="94" y="777" fill="#698098" font-size="22" font-weight="400" text-anchor="start">按固定 JSON 字段返回</text><rect x="92" y="855" width="556" height="86" rx="14" fill="#edf4ff" stroke="#dce8f9" stroke-width="1.5" filter="url(#shadow)" /><text x="115" y="890" fill="#397ad1" font-size="23" font-weight="600" text-anchor="start">“你是架构师”属于内容设定，</text><text x="115" y="922" fill="#397ad1" font-size="23" font-weight="600" text-anchor="start">不会把 User 自动变成 System。</text><text x="792" y="235" fill="#188d83" font-size="30" font-weight="700" text-anchor="start">消息维度：来源与指令层级</text><text x="792" y="275" fill="#698098" font-size="21" font-weight="400" text-anchor="start">OpenAI 式层级：仅比较以下三类指令</text><rect x="792" y="300" width="556" height="88" rx="22" fill="#f2edff" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)" /><text x="818" y="335" fill="#7c63bb" font-size="25" font-weight="700" text-anchor="start">System</text><text x="818" y="367" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">更高层行为要求</text><path d="M1070 391 L1070 414" fill="none" stroke="#8ba3b8" stroke-width="2.4" marker-end="url(#arrow)" /><rect x="792" y="418" width="556" height="88" rx="22" fill="#edf4ff" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)" /><text x="818" y="453" fill="#397ad1" font-size="25" font-weight="700" text-anchor="start">Developer</text><text x="818" y="485" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">应用职责与业务规则</text><path d="M1070 509 L1070 532" fill="none" stroke="#8ba3b8" stroke-width="2.4" marker-end="url(#arrow)" /><rect x="792" y="536" width="556" height="88" rx="22" fill="#eaf8f3" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)" /><text x="818" y="571" fill="#188d83" font-size="25" font-weight="700" text-anchor="start">User</text><text x="818" y="603" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">当前任务与用户输入</text><text x="792" y="697" fill="#698098" font-size="22" font-weight="600" text-anchor="start">以下表达回复与工具数据</text><rect x="792" y="720" width="556" height="88" rx="22" fill="#f7f9fc" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)" /><text x="817" y="754" fill="#18334f" font-size="25" font-weight="700" text-anchor="start">Assistant</text><text x="817" y="787" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">回答、历史和工具调用请求</text><rect x="792" y="825" width="556" height="88" rx="22" fill="#f7f9fc" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)" /><text x="817" y="859" fill="#18334f" font-size="25" font-weight="700" text-anchor="start">Tool</text><text x="817" y="892" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">执行结果；不自动取得指令权限</text><rect x="60" y="1015" width="1320" height="65" rx="15" fill="#e7eff7" stroke="#e7eff7" stroke-width="1.5" filter="url(#shadow)" /><text x="90" y="1057" fill="#18334f" font-size="24" font-weight="600" text-anchor="start">角色支持与映射因接口而异；指令优先级不能代替服务端权限校验。</text></g></svg>