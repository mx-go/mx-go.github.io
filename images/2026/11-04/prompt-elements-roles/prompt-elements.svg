<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950" role="img" aria-labelledby="title desc"><title id="title">提示词的四类基本内容与两项工程补充</title><desc id="desc">任务指令、上下文、输入数据和输出要求构成内容骨架，角色定位与约束按任务需要补充。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fafcff" /><stop offset="1" stop-color="#edf4fb" /></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#234363" flood-opacity=".07" /></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#6c8aa5" stroke-width="1.6" /></marker></defs><rect width="1440" height="950" rx="28" fill="url(#bg)" /><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="82" fill="#18334f" font-size="44" font-weight="700" text-anchor="start">提示词的内容结构</text><text x="60" y="130" fill="#698098" font-size="23" font-weight="400" text-anchor="start">先明确任务与材料，再按需要补充职责与行为边界。</text><text x="60" y="207" fill="#18334f" font-size="27" font-weight="700" text-anchor="start">四类基本内容</text><rect x="60" y="238" width="300" height="242" rx="22" fill="#eaf2ff" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)" /><text x="84" y="280" fill="#397ad1" font-size="23" font-weight="700" text-anchor="start">01</text><text x="84" y="325" fill="#18334f" font-size="31" font-weight="700" text-anchor="start">任务指令</text><text x="84" y="367" fill="#397ad1" font-size="23" font-weight="600" text-anchor="start">要完成什么？</text><text x="84" y="414" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">分析 / 提取 / 分类</text><text x="84" y="448" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">明确完成条件</text><rect x="400" y="238" width="300" height="242" rx="22" fill="#e8f7f2" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)" /><text x="424" y="280" fill="#188d83" font-size="23" font-weight="700" text-anchor="start">02</text><text x="424" y="325" fill="#18334f" font-size="31" font-weight="700" text-anchor="start">上下文</text><text x="424" y="367" fill="#188d83" font-size="23" font-weight="600" text-anchor="start">在什么条件下判断？</text><text x="424" y="414" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">背景 / 规则 / 环境</text><text x="424" y="448" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">保留有效条件</text><rect x="740" y="238" width="300" height="242" rx="22" fill="#fff5e5" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)" /><text x="764" y="280" fill="#b97d25" font-size="23" font-weight="700" text-anchor="start">03</text><text x="764" y="325" fill="#18334f" font-size="31" font-weight="700" text-anchor="start">输入数据</text><text x="764" y="367" fill="#b97d25" font-size="23" font-weight="600" text-anchor="start">实际处理什么？</text><text x="764" y="414" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">代码 / 日志 / 文档</text><text x="764" y="448" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">与任务指令分开</text><rect x="1080" y="238" width="300" height="242" rx="22" fill="#f2edff" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)" /><text x="1104" y="280" fill="#7c63bb" font-size="23" font-weight="700" text-anchor="start">04</text><text x="1104" y="325" fill="#18334f" font-size="31" font-weight="700" text-anchor="start">输出要求</text><text x="1104" y="367" fill="#7c63bb" font-size="23" font-weight="600" text-anchor="start">如何交付结果？</text><text x="1104" y="414" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">JSON / 表格 / 文本</text><text x="1104" y="448" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">字段、类型与边界</text><path d="M60 532 L1380 532" fill="none" stroke="#8ba3b8" stroke-width="2.4" /><text x="60" y="592" fill="#18334f" font-size="27" font-weight="700" text-anchor="start">两项常用工程补充</text><rect x="60" y="622" width="640" height="178" rx="22" fill="#eff5ff" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)" /><text x="86" y="672" fill="#397ad1" font-size="30" font-weight="700" text-anchor="start">角色定位</text><text x="86" y="719" fill="#3f5873" font-size="23" font-weight="400" text-anchor="start">明确职责与分析视角</text><text x="86" y="758" fill="#698098" font-size="22" font-weight="400" text-anchor="start">不增加知识或真实权限</text><rect x="740" y="622" width="640" height="178" rx="22" fill="#edf8f4" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)" /><text x="766" y="672" fill="#188d83" font-size="30" font-weight="700" text-anchor="start">约束</text><text x="766" y="719" fill="#3f5873" font-size="23" font-weight="400" text-anchor="start">规定行为与结论边界</text><text x="766" y="758" fill="#698098" font-size="22" font-weight="400" text-anchor="start">程序权限需要独立执行</text><rect x="60" y="843" width="1320" height="66" rx="15" fill="#e7eff7" stroke="#e7eff7" stroke-width="1.5" filter="url(#shadow)" /><text x="90" y="885" fill="#18334f" font-size="24" font-weight="600" text-anchor="start">按任务需要组织内容，避免重复背景与互相冲突的规则。</text></g></svg>