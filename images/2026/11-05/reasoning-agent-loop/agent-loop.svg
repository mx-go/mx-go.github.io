<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1030" viewBox="0 0 1440 1030" role="img" aria-labelledby="title desc"><title id="title">Agent Loop：决策、执行与反馈闭环</title><desc id="desc">模型提出回答或动作请求；运行时控制校验、执行、状态更新与停止。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fafcff"/><stop offset="1" stop-color="#eef4fb"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#6d89a3" stroke-width="1.7"/></marker></defs><rect width="1440" height="1030" rx="28" fill="url(#bg)"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="60" y="80" fill="#18334f" font-size="40" font-weight="700" text-anchor="start">Agent Loop：决策、执行与反馈闭环</text><text x="60" y="125" fill="#6b8199" font-size="23" font-weight="400" text-anchor="start">模型提出回答或动作请求；运行时控制校验、执行、状态更新与停止。</text><path d="M720 280 V315 H235 V350" fill="none" stroke="#6d89a3" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M410 425 H545" fill="none" stroke="#6d89a3" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="423.0" y="386" width="110" height="30" rx="7" fill="#f5f9fd"/><text x="478" y="409" fill="#59738d" font-size="21" font-weight="400" text-anchor="middle">工具请求</text><path d="M895 425 H1030" fill="none" stroke="#6d89a3" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="930.0" y="386" width="66" height="30" rx="7" fill="#f5f9fd"/><text x="963" y="409" fill="#59738d" font-size="21" font-weight="400" text-anchor="middle">允许</text><path d="M235 500 V650" fill="none" stroke="#6d89a3" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="180.0" y="558" width="110" height="30" rx="7" fill="#f5f9fd"/><text x="235" y="581" fill="#59738d" font-size="21" font-weight="400" text-anchor="middle">直接回答</text><path d="M1205 500 V650" fill="none" stroke="#6d89a3" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M720 500 V565 H1180 V650" fill="none" stroke="#6d89a3" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="852.0" y="527" width="176" height="30" rx="7" fill="#f5f9fd"/><text x="940" y="550" fill="#59738d" font-size="21" font-weight="400" text-anchor="middle">拒绝：回填原因</text><path d="M1030 725 H895" fill="none" stroke="#6d89a3" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M545 725 H410" fill="none" stroke="#6d89a3" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="445.0" y="686" width="66" height="30" rx="7" fill="#f5f9fd"/><text x="478" y="709" fill="#59738d" font-size="21" font-weight="400" text-anchor="middle">结束</text><path d="M720 800 V865 H30 V425 H60" fill="none" stroke="#6d89a3" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="9 7"/><rect x="379.0" y="832" width="242" height="30" rx="7" fill="#f5f9fd"/><text x="500" y="855" fill="#59738d" font-size="21" font-weight="400" text-anchor="middle">允许继续：进入下一轮</text><rect x="545" y="170" width="350" height="110" rx="20" fill="#eaf2ff" stroke="#d6e3ef" stroke-width="1.5"/><text x="720.0" y="217" fill="#18334f" font-size="29" font-weight="700" text-anchor="middle">用户目标与状态</text><text x="720.0" y="257" fill="#347bd6" font-size="23" font-weight="400" text-anchor="middle">当前任务与必要上下文</text><rect x="60" y="350" width="350" height="150" rx="20" fill="#f2edff" stroke="#d6e3ef" stroke-width="1.5"/><text x="235.0" y="397" fill="#18334f" font-size="29" font-weight="700" text-anchor="middle">模型决策</text><text x="235.0" y="437" fill="#7e60cc" font-size="23" font-weight="400" text-anchor="middle">生成回答</text><text x="235.0" y="470" fill="#7e60cc" font-size="23" font-weight="400" text-anchor="middle">或结构化动作请求</text><rect x="545" y="350" width="350" height="150" rx="20" fill="#fff5e5" stroke="#d6e3ef" stroke-width="1.5"/><text x="720.0" y="397" fill="#18334f" font-size="29" font-weight="700" text-anchor="middle">执行前校验</text><text x="720.0" y="437" fill="#c48524" font-size="23" font-weight="400" text-anchor="middle">身份、权限与范围</text><text x="720.0" y="470" fill="#c48524" font-size="23" font-weight="400" text-anchor="middle">工具参数与业务规则</text><rect x="1030" y="350" width="350" height="150" rx="20" fill="#e8f7f2" stroke="#d6e3ef" stroke-width="1.5"/><text x="1205.0" y="397" fill="#18334f" font-size="29" font-weight="700" text-anchor="middle">执行工具</text><text x="1205.0" y="437" fill="#159486" font-size="23" font-weight="400" text-anchor="middle">调用实际能力</text><text x="1205.0" y="470" fill="#159486" font-size="23" font-weight="400" text-anchor="middle">收集成功或失败结果</text><rect x="1030" y="650" width="350" height="150" rx="20" fill="#e8f7f2" stroke="#d6e3ef" stroke-width="1.5"/><text x="1205.0" y="697" fill="#18334f" font-size="29" font-weight="700" text-anchor="middle">更新任务状态</text><text x="1205.0" y="737" fill="#159486" font-size="23" font-weight="400" text-anchor="middle">整理工具结果</text><text x="1205.0" y="770" fill="#159486" font-size="23" font-weight="400" text-anchor="middle">或记录拒绝原因</text><rect x="545" y="650" width="350" height="150" rx="20" fill="#fff5e5" stroke="#d6e3ef" stroke-width="1.5"/><text x="720.0" y="697" fill="#18334f" font-size="29" font-weight="700" text-anchor="middle">继续条件检查</text><text x="720.0" y="737" fill="#c48524" font-size="23" font-weight="400" text-anchor="middle">完成度、剩余预算</text><text x="720.0" y="770" fill="#c48524" font-size="23" font-weight="400" text-anchor="middle">是否仍有实际进展</text><rect x="60" y="650" width="350" height="150" rx="20" fill="#eaf2ff" stroke="#d6e3ef" stroke-width="1.5"/><text x="235.0" y="697" fill="#18334f" font-size="29" font-weight="700" text-anchor="middle">校验并返回</text><text x="235.0" y="737" fill="#347bd6" font-size="23" font-weight="400" text-anchor="middle">输出可确认结论</text><text x="235.0" y="770" fill="#347bd6" font-size="23" font-weight="400" text-anchor="middle">说明未解决项</text><rect x="60" y="930" width="1320" height="62" rx="16" fill="#e7eff7"/><text x="88" y="969" fill="#294764" font-size="23" font-weight="600" text-anchor="start">记忆点：决策 → 执行 → 反馈；限制累计调用、Token、耗时与无进展次数。</text></g></svg>