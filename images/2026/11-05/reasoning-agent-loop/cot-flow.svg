<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 0 1440 470" role="img" aria-labelledby="title desc"><title id="title">CoT：沿一条路径逐步推导</title><desc id="desc">中间结果为下一步提供条件；典型用法可以在一次模型调用中完成。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fafcff"/><stop offset="1" stop-color="#eef4fb"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#6d89a3" stroke-width="1.7"/></marker></defs><rect width="1440" height="470" rx="28" fill="url(#bg)"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="60" y="80" fill="#18334f" font-size="40" font-weight="700" text-anchor="start">CoT：沿一条路径逐步推导</text><text x="60" y="125" fill="#6b8199" font-size="23" font-weight="400" text-anchor="start">中间结果为下一步提供条件；典型用法可以在一次模型调用中完成。</text><path d="M284 264 H326" fill="none" stroke="#6d89a3" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M560 264 H602" fill="none" stroke="#6d89a3" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M836 264 H878" fill="none" stroke="#6d89a3" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1112 264 H1154" fill="none" stroke="#6d89a3" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="50" y="190" width="234" height="150" rx="20" fill="#eaf2ff" stroke="#d6e3ef" stroke-width="1.5"/><text x="167.0" y="237" fill="#18334f" font-size="29" font-weight="700" text-anchor="middle">问题与约束</text><text x="167.0" y="277" fill="#347bd6" font-size="23" font-weight="400" text-anchor="middle">明确任务</text><text x="167.0" y="310" fill="#347bd6" font-size="23" font-weight="400" text-anchor="middle">与已知条件</text><rect x="326" y="190" width="234" height="150" rx="20" fill="#e8f7f2" stroke="#d6e3ef" stroke-width="1.5"/><text x="443.0" y="237" fill="#18334f" font-size="29" font-weight="700" text-anchor="middle">提取