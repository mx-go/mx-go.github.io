<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1350" viewBox="0 0 1200 1350" role="img" aria-labelledby="title desc"><title id="title">工具调用：模型提议，后端决定</title><desc id="desc">模型提出调用请求，后端检查身份、租户、资源权限、参数、审批与预算。检查失败时拒绝调用，需要审批但尚未完成时暂停等待，批准后重新校验；全部检查通过后工具执行，实际结果返回模型，再经输出校验后交付。工具超时可能意味着结果未知。</desc><defs><marker id="arrow-8a9fb3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#8a9fb3" stroke-width="1.8"/></marker><marker id="arrow-29957f" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#29957f" stroke-width="1.8"/></marker><marker id="arrow-c56a75" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#c56a75" stroke-width="1.8"/></marker><marker id="arrow-bd903b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#bd903b" stroke-width="1.8"/></marker></defs><rect width="1200" height="1350" rx="26" fill="#f5f9fd"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="64" y="70" font-size="38" fill="#193750" font-weight="700">工具调用：模型提议，后端决定</text><text x="64" y="115" font-size="24" fill="#526f88" font-weight="400">沿主线向下阅读：先检查，后执行，再核验回答。</text><rect x="64" y="165" width="716" height="135" rx="20" fill="#eaf3ff" stroke="#4a83c5"/><circle cx="108" cy="213" r="23" fill="#4a83c5"/><text x="100" y="222" font-size="25" fill="#fff" font-weight="700">1</text><text x="152" y="221" font-size="29" fill="#24435d" font-weight="700">模型提出调用请求</text><text x="152" y="263" font-size="22" fill="#526f88" font-weight="400">选择工具、填写参数；不代表已经获得执行授权</text><path d="M422 310 V350" fill="none" stroke="#8a9fb3" stroke-width="3" marker-end="url(#arrow-8a9fb3)"/><text x="444" y="338" font-size="22" fill="#526f88" font-weight="400">把调用请求交给后端</text><rect x="64" y="365" width="716" height="200" rx="20" fill="#eaf8f3" stroke="#29957f"/><circle cx="108" cy="413" r="23" fill="#29957f"/><text x="100" y="422" font-size="25" fill="#fff" font-weight="700">2</text><text x="152" y="421" font-size="29" fill="#24435d" font-weight="700">后端独立检查</text><text x="152" y="463" font-size="22" fill="#526f88" font-weight="400">身份与租户 · 资源权限 · 业务参数</text><text x="152" y="499" font-size="22" fill="#526f88" font-weight="400">必要审批 · 调用次数与预算</text><text x="152" y="535" font-size="22" fill="#526f88" font-weight="400">这些检查由程序执行，不能由模型自行判断</text><path d="M780 415 H846" fill="none" stroke="#c56a75" stroke-width="3" marker-end="url(#arrow-c56a75)"/><text x="793" y="397" font-size="20" fill="#b45b67" font-weight="600">失败</text><rect x="856" y="365" width="280" height="142" rx="20" fill="#fff0f1" stroke="#e3b0b8"/><text x="882" y="408" font-size="27" fill="#b45b67" font-weight="700">拒绝调用</text><text x="882" y="448" font-size="21" fill="#526f88" font-weight="400">越权、参数非法</text><text x="882" y="480" font-size="21" fill="#526f88" font-weight="400">或审批无效等</text><path d="M780 530 H810 V600 H846" fill="none" stroke="#bd903b" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-bd903b)"/><text x="817" y="572" font-size="20" fill="#a67b2e" font-weight="600">待批</text><rect x="856" y="535" width="280" height="165" rx="20" fill="#fff6e3" stroke="#e4c78e"/><text x="882" y="577" font-size="25" fill="#a67b2e" font-weight="700">暂停等待审批</text><text x="882" y="616" font-size="21" fill="#526f88" font-weight="400">必要审批尚未完成</text><text x="882" y="654" font-size="21" fill="#a67b2e" font-weight="600">批准后重新校验</text><text x="864" y="741" font-size="22" fill="#607990" font-weight="600">以上两种情况：</text><text x="864" y="778" font-size="24" fill="#3b566d" font-weight="700">业务工具不执行</text><path d="M422 575 V650" fill="none" stroke="#29957f" stroke-width="3" marker-end="url(#arrow-29957f)"/><text x="444" y="620" font-size="23" fill="#248674" font-weight="600">全部检查通过</text><rect x="64" y="665" width="716" height="135" rx="20" fill="#eff8f1" stroke="#53a078"/><circle cx="108" cy="713" r="23" fill="#53a078"/><text x="100" y="722" font-size="25" fill="#fff" font-weight="700">3</text><text x="152" y="721" font-size="29" fill="#24435d" font-weight="700">工具执行已授权操作</text><text x="152" y="763" font-size="22" fill="#526f88" font-weight="400">仅在许可范围内执行，受超时与幂等控制</text><path d="M422 810 V865" fill="none" stroke="#8a9fb3" stroke-width="3" marker-end="url(#arrow-8a9fb3)"/><text x="444" y="847" font-size="22" fill="#526f88" font-weight="400">返回实际执行状态</text><rect x="64" y="880" width="716" height="165" rx="20" fill="#eef1fc" stroke="#7a83ba"/><circle cx="108" cy="928" r="23" fill="#7a83ba"/><text x="100" y="937" font-size="25" fill="#fff" font-weight="700">4</text><text x="152" y="936" font-size="29" fill="#24435d" font-weight="700">模型依据真实结果组织答复</text><text x="152" y="978" font-size="22" fill="#526f88" font-weight="400">成功 / 失败 / 未知，按实际状态如实说明</text><text x="152" y="1014" font-size="22" fill="#526f88" font-weight="400">“已受理”不能写成“已完成”</text><path d="M422 1055 V1100" fill="none" stroke="#8a9fb3" stroke-width="3" marker-end="url(#arrow-8a9fb3)"/><rect x="64" y="1115" width="1072" height="102" rx="20" fill="#e8f5f1" stroke="#aad7c7"/><text x="96" y="1156" font-size="28" fill="#277e6c" font-weight="700">输出校验通过后，再交付用户</text><text x="96" y="1192" font-size="23" fill="#526f88" font-weight="400">核对事实、敏感信息与内容安全；不能撤销已经执行的危险操作</text><rect x="64" y="1252" width="1072" height="65" rx="20" fill="#e5edf6" stroke="#d3deea"/><text x="90" y="1294" font-size="25" fill="#38556e" font-weight="600">拒绝 / 等待 = 工具未执行；超时 = 执行结果可能未知</text></g></svg>
