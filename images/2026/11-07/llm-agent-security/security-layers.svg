<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc"><title id="title">企业级 LLM 分层安全防护</title><desc id="desc">应用层、模型交互层、工具执行层和数据层分别承担防护职责，运维治理贯穿全链路。本图表达职责，不表示执行先后。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#edf4fb"/></linearGradient></defs><rect width="1280" height="960" rx="26" fill="url(#bg)"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="72" fill="#18344e" font-size="38" font-weight="700">企业级 LLM：分层防护与独立执行边界</text><text x="48" y="116" fill="#607991" font-size="23">分层明确职责；监控贯穿全程；授权发生在工具执行之前。</text><rect x="48" y="164" width="912" height="148" rx="18" fill="#edf5ff" stroke="#427bc3" stroke-opacity=".2"/><text x="70" y="200" fill="#427bc3" font-size="25" font-weight="700">01 · 应用层</text><text x="930" y="198" fill="#607991" font-size="19" text-anchor="end">入口与任务控制</text><rect x="70" y="220" width="280" height="72" rx="12" fill="#fff" fill-opacity=".85"/><text x="85" y="248" fill="#203b54" font-size="23" font-weight="600">身份认证</text><text x="85" y="275" fill="#57728c" font-size="18">用户与租户归属</text><rect x="362" y="220" width="280" height="72" rx="12" fill="#fff" fill-opacity=".85"/><text x="377" y="248" fill="#203b54" font-size="23" font-weight="600">输入防护</text><text x="377" y="275" fill="#57728c" font-size="18">校验、检测与风险分级</text><rect x="654" y="220" width="280" height="72" rx="12" fill="#fff" fill-opacity=".85"/><text x="669" y="248" fill="#203b54" font-size="23" font-weight="600">任务预算</text><text x="669" y="275" fill="#57728c" font-size="18">次数、Token、时间与成本</text><rect x="48" y="332" width="912" height="148" rx="18" fill="#edf8f5" stroke="#238d7b" stroke-opacity=".2"/><text x="70" y="368" fill="#238d7b" font-size="25" font-weight="700">02 · 模型交互层</text><text x="930" y="366" fill="#607991" font-size="19" text-anchor="end">由应用组织与实施</text><rect x="70" y="388" width="280" height="72" rx="12" fill="#fff" fill-opacity=".85"/><text x="85" y="416" fill="#203b54" font-size="23" font-weight="600">指令与数据分离</text><text x="85" y="443" fill="#57728c" font-size="18">外部内容不升级为规则</text><rect x="362" y="388" width="280" height="72" rx="12" fill="#fff" fill-opacity=".85"/><text x="377" y="416" fill="#203b54" font-size="23" font-weight="600">上下文治理</text><text x="377" y="443" fill="#57728c" font-size="18">RAG / Memory 权限与来源</text><rect x="654" y="388" width="280" height="72" rx="12" fill="#fff" fill-opacity=".85"/><text x="669" y="416" fill="#203b54" font-size="23" font-weight="600">回答验证</text><text x="669" y="443" fill="#57728c" font-size="18">事实、状态与敏感信息</text><rect x="48" y="500" width="912" height="148" rx="18" fill="#fff4e8" stroke="#be792e" stroke-opacity=".2"/><text x="70" y="536" fill="#be792e" font-size="25" font-weight="700">03 · 工具执行层</text><text x="930" y="534" fill="#607991" font-size="19" text-anchor="end">后端独立强制校验</text><rect x="70" y="556" width="280" height="72" rx="12" fill="#fff" fill-opacity=".85"/><text x="85" y="584" fill="#203b54" font-size="23" font-weight="600">资源授权</text><text x="85" y="611" fill="#57728c" font-size="18">RBAC / ABAC 与业务参数</text><rect x="362" y="556" width="280" height="72" rx="12" fill="#fff" fill-opacity=".85"/><text x="377" y="584" fill="#203b54" font-size="23" font-weight="600">高风险审批</text><text x="377" y="611" fill="#57728c" font-size="18">绑定操作、参数与有效期</text><rect x="654" y="556" width="280" height="72" rx="12" fill="#fff" fill-opacity=".85"/><text x="669" y="584" fill="#203b54" font-size="23" font-weight="600">受控执行</text><text x="669" y="611" fill="#57728c" font-size="18">最小权限、幂等与超时</text><rect x="48" y="668" width="912" height="148" rx="18" fill="#f2effc" stroke="#8064b6" stroke-opacity=".2"/><text x="70" y="704" fill="#8064b6" font-size="25" font-weight="700">04 · 数据层</text><text x="930" y="702" fill="#607991" font-size="19" text-anchor="end">最小暴露与隔离存储</text><rect x="70" y="724" width="280" height="72" rx="12" fill="#fff" fill-opacity=".85"/><text x="85" y="752" fill="#203b54" font-size="23" font-weight="600">访问隔离</text><text x="85" y="779" fill="#57728c" font-size="18">用户、租户与资源范围</text><rect x="362" y="724" width="280" height="72" rx="12" fill="#fff" fill-opacity=".85"/><text x="377" y="752" fill="#203b54" font-size="23" font-weight="600">数据保护</text><text x="377" y="779" fill="#57728c" font-size="18">最小化、脱敏与加密</text><rect x="654" y="724" width="280" height="72" rx="12" fill="#fff" fill-opacity=".85"/><text x="669" y="752" fill="#203b54" font-size="23" font-weight="600">生命周期</text><text x="669" y="779" fill="#57728c" font-size="18">版本、有效期与撤销</text><rect x="990" y="164" width="242" height="652" rx="18" fill="#eaf0fa" stroke="#cdd9ee"/><text x="1111" y="208" text-anchor="middle" fill="#365a86" font-size="27" font-weight="700">运维治理</text><text x="1111" y="242" text-anchor="middle" fill="#667e98" font-size="19">贯穿全部层级</text><rect x="1006" y="272" width="210" height="100" rx="14" fill="#fff"/><text x="1111" y="311" text-anchor="middle" fill="#365a86" font-size="25" font-weight="600">实时监控</text><text x="1111" y="344" text-anchor="middle" fill="#627b94" font-size="16">Token / 成本 / 任务状态</text><rect x="1006" y="398" width="210" height="100" rx="14" fill="#fff"/><text x="1111" y="437" text-anchor="middle" fill="#365a86" font-size="25" font-weight="600">脱敏审计</text><text x="1111" y="470" text-anchor="middle" fill="#627b94" font-size="16">身份 / 决策 / 执行结果</text><rect x="1006" y="524" width="210" height="100" rx="14" fill="#fff"/><text x="1111" y="563" text-anchor="middle" fill="#365a86" font-size="25" font-weight="600">告警与处置</text><text x="1111" y="596" text-anchor="middle" fill="#627b94" font-size="16">停止 / 撤权 / 隔离污染</text><rect x="1006" y="650" width="210" height="100" rx="14" fill="#fff"/><text x="1111" y="689" text-anchor="middle" fill="#365a86" font-size="25" font-weight="600">持续评测</text><text x="1111" y="722" text-anchor="middle" fill="#627b94" font-size="16">幻觉 / 注入 / 误拦截</text><rect x="48" y="850" width="1184" height="72" rx="16" fill="#e1ebf5"/><text x="76" y="880" fill="#23425d" font-size="22" font-weight="600">事实验证：回答是否有依据　　授权执行：操作是否被允许</text><text x="76" y="907" fill="#617b94" font-size="18">职责分层示意，不表示请求时序；System Prompt 与最终输出检查不能替代执行前授权。</text></g></svg>