<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">共享上下文窗口的Token预算</title><desc id="desc">16000 Token共享窗口由10000输入、4000生成预留和2000余量组成。输入包含800指令、3200历史、500用户输入、1500工具与4000检索资料。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf4fb"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#244563" flood-opacity=".06"/></filter></defs><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="1200" height="850" rx="26" fill="url(#bg)" /><text x="48" y="66" font-size="34" fill="#19354e" font-weight="700" text-anchor="start">上下文预算：先预留生成，再组织输入</text><text x="48" y="108" font-size="21" fill="#61798d" font-weight="400" text-anchor="start">假设共享窗口容量为 16,000 Token，以下数值仅用于预算示例</text><rect x="48" y="144" width="1104" height="149" rx="20" fill="white" filter="url(#shadow)"/><rect x="72" y="173" width="660" height="61" rx="0" fill="#3d94bd" /><text x="402.0" y="211" font-size="24" fill="#ffffff" font-weight="650" text-anchor="middle">输入 10,000</text><rect x="732" y="173" width="264" height="61" rx="0" fill="#eeb66c" /><text x="864.0" y="211" font-size="22" fill="#233d53" font-weight="650" text-anchor="middle">生成预留 4,000</text><rect x="996" y="173" width="132" height="61" rx="0" fill="#dce5ef" /><text x="1062.0" y="211" font-size="18" fill="#233d53" font-weight="650" text-anchor="middle">余量 2,000</text><text x="72" y="268" font-size="20" fill="#19354e" font-weight="600" text-anchor="start">先预留生成与安全余量，再组织本次输入</text><text x="48" y="342" font-size="24" fill="#19354e" font-weight="650" text-anchor="start">输入组成</text><text x="1152" y="342" font-size="23" fill="#257c9c" font-weight="650" text-anchor="end">10,000 Token</text><rect x="48" y="365" width="1104" height="51" rx="10" fill="#ffffff" /><circle cx="75" cy="391" r="6" fill="#6a90cd"/><text x="96" y="398" font-size="21" fill="#19354e" font-weight="400" text-anchor="start">系统与应用指令</text><rect x="589" y="383" width="394" height="14" rx="5" fill="#e4ebf3" /><rect x="589" y="383" width="78.8" height="14" rx="5" fill="#6a90cd" /><text x="1128" y="398" font-size="22" fill="#19354e" font-weight="600" text-anchor="end">800</text><rect x="48" y="427" width="1104" height="51" rx="10" fill="#edf3fa" /><circle cx="75" cy="453" r="6" fill="#5898c8"/><text x="96" y="460" font-size="21" fill="#19354e" font-weight="400" text-anchor="start">历史摘要与最近交互</text><rect x="589" y="445" width="394" height="14" rx="5" fill="#e4ebf3" /><rect x="589" y="445" width="315.2" height="14" rx="5" fill="#5898c8" /><text x="1128" y="460" font-size="22" fill="#19354e" font-weight="600" text-anchor="end">3,200</text><rect x="48" y="489" width="1104" height="51" rx="10" fill="#ffffff" /><circle cx="75" cy="515" r="6" fill="#7db7d8"/><text x="96" y="522" font-size="21" fill="#19354e" font-weight="400" text-anchor="start">当前用户输入</text><rect x="589" y="507" width="394" height="14" rx="5" fill="#e4ebf3" /><rect x="589" y="507" width="49.25" height="14" rx="5" fill="#7db7d8" /><text x="1128" y="522" font-size="22" fill="#19354e" font-weight="600" text-anchor="end">500</text><rect x="48" y="551" width="1104" height="51" rx="10" fill="#edf3fa" /><circle cx="75" cy="577" r="6" fill="#50a9b3"/><text x="96" y="584" font-size="21" fill="#19354e" font-weight="400" text-anchor="start">工具定义与必要结果</text><rect x="589" y="569" width="394" height="14" rx="5" fill="#e4ebf3" /><rect x="589" y="569" width="147.75" height="14" rx="5" fill="#50a9b3" /><text x="1128" y="584" font-size="22" fill="#19354e" font-weight="600" text-anchor="end">1,500</text><rect x="48" y="613" width="1104" height="51" rx="10" fill="#ffffff" /><circle cx="75" cy="639" r="6" fill="#55b9a6"/><text x="96" y="646" font-size="21" fill="#19354e" font-weight="400" text-anchor="start">检索资料</text><rect x="589" y="631" width="394" height="14" rx="5" fill="#e4ebf3" /><rect x="589" y="631" width="394.0" height="14" rx="5" fill="#55b9a6" /><text x="1128" y="646" font-size="22" fill="#19354e" font-weight="600" text-anchor="end">4,000</text><rect x="48" y="704" width="1104" height="115" rx="18" fill="#e6eff9" /><text x="72" y="744" font-size="21" fill="#19354e" font-weight="600" text-anchor="start">计数对象：最终消息、工具定义、工具结果与实际注入的资料。</text><text x="72" y="780" font-size="18" fill="#61798d" font-weight="400" text-anchor="start">推理 Token 是否计入生成预算，以及输入 / 输出是否共享窗口，均需核对接口。</text></g></svg>