<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title"><title id="title">最大生成预算与结束状态示意</title><metadata></metadata><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf4fb"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8298ab"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#244563" flood-opacity=".06"/></filter></defs><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="1200" height="710" rx="24" fill="url(#bg)" /><text x="48" y="66" font-size="33" fill="#19354e" font-weight="700" text-anchor="start">生成预算是上限，不是必须达到的长度</text><text x="48" y="108" font-size="21" fill="#61798d" font-weight="400" text-anchor="start">假设单次生成上限为 1,000 Token，实际可能提前结束或触及上限</text><rect x="48" y="150" width="1104" height="188" rx="16" fill="#ffffff" filter="url(#shadow)"/><text x="74" y="193" font-size="25" fill="#19354e" font-weight="650" text-anchor="start">自然结束</text><text x="1126" y="193" font-size="22" fill="#19354e" font-weight="400" text-anchor="end">实际生成 340 / 上限 1,000</text><rect x="74" y="217" width="1052" height="32" rx="7" fill="#e9eff6" /><rect x="74" y="217" width="357.68" height="32" rx="7" fill="#0b9484" /><text x="74" y="294" font-size="22" fill="#19354e" font-weight="400" text-anchor="start">提前完成：继续检查格式和业务内容</text><rect x="48" y="366" width="1104" height="188" rx="16" fill="#ffffff" filter="url(#shadow)"/><text x="74" y="409" font-size="25" fill="#19354e" font-weight="650" text-anchor="start">达到上限</text><text x="1126" y="409" font-size="22" fill="#19354e" font-weight="400" text-anchor="end">实际生成 1000 / 上限 1,000</text><rect x="74" y="433" width="1052" height="32" rx="7" fill="#e9eff6" /><rect x="74" y="433" width="1052.0" height="32" rx="7" fill="#d99035" /><text x="74" y="510" font-size="22" fill="#19354e" font-weight="400" text-anchor="start">可能未完成：检查结束原因与结果完整性</text><rect x="48" y="584" width="1104" height="94" rx="16" fill="#e6eff9" /><text x="72" y="621" font-size="20" fill="#19354e" font-weight="400" text-anchor="start">部分模型的生成预算还包含推理 Token；可见答案不一定用满设置的上限。</text><text x="72" y="655" font-size="18" fill="#61798d" font-weight="400" text-anchor="start">示意数值不代表实际测试；预算、停止原因和结构校验需要一起判断。</text></g></svg>