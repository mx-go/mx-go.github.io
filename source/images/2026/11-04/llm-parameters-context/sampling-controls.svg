<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc"><title id="title">Temperature、Top-P 与 Top-K 的区别</title><desc id="desc">基准概率为52%、24%、16%、8%。T从1降到0.5时，概率变为75.1%、16.0%、7.1%、1.8%。Top-K等于2保留A和B；Top-P等于0.9保留A、B、C。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff" /><stop offset="1" stop-color="#edf4fb" /></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#244563" flood-opacity=".06" /></filter></defs><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="1200" height="870" rx="26" fill="url(#bg)" /><text x="48" y="66" font-size="34" fill="#19354e" font-weight="700" text-anchor="start">三种采样控制：分布、数量与概率质量</text><text x="48" y="108" font-size="21" fill="#61798d" font-weight="400" text-anchor="start">同一组候选 A / B / C / D，分别观察三个参数的作用</text><rect x="48" y="150" width="352" height="566" rx="20" fill="white" filter="url(#shadow)" /><rect x="72" y="176" width="44" height="5" rx="2" fill="#237ac7" /><text x="72" y="220" font-size="26" fill="#19354e" font-weight="650" text-anchor="start">Temperature</text><text x="72" y="255" font-size="20" fill="#61798d" font-weight="400" text-anchor="start">调整分布形状</text><rect x="72" y="281" width="14" height="9" rx="3" fill="#cbd7e8" /><text x="93" y="291" font-size="16" fill="#61798d" font-weight="400" text-anchor="start">T = 1</text><rect x="198" y="281" width="14" height="9" rx="3" fill="#237ac7" /><text x="219" y="291" font-size="16" fill="#61798d" font-weight="400" text-anchor="start">T = 0.5</text><text x="72" y="351" font-size="19" fill="#19354e" font-weight="600" text-anchor="start">A</text><rect x="101" y="333" width="174" height="12" rx="3" fill="#f0f4f9" /><rect x="101" y="333" width="90.48" height="12" rx="3" fill="#cbd7e8" /><text x="292" y="344" font-size="17" fill="#61798d" font-weight="400" text-anchor="start">52%</text><rect x="101" y="354" width="174" height="12" rx="3" fill="#f0f4f9" /><rect x="101" y="354" width="130.69" height="12" rx="3" fill="#237ac7" /><text x="292" y="366" font-size="17" fill="#237ac7" font-weight="600" text-anchor="start">75.1%</text><text x="72" y="421" font-size="19" fill="#19354e" font-weight="600" text-anchor="start">B</text><rect x="101" y="403" width="174" height="12" rx="3" fill="#f0f4f9" /><rect x="101" y="403" width="41.76" height="12" rx="3" fill="#cbd7e8" /><text x="292" y="414" font-size="17" fill="#61798d" font-weight="400" text-anchor="start">24%</text><rect x="101" y="424" width="174" height="12" rx="3" fill="#f0f4f9" /><rect x="101" y="424" width="27.84" height="12" rx="3" fill="#237ac7" /><text x="292" y="436" font-size="17" fill="#237ac7" font-weight="600" text-anchor="start">16.0%</text><text x="72" y="491" font-size="19" fill="#19354e" font-weight="600" text-anchor="start">C</text><rect x="101" y="473" width="174" height="12" rx="3" fill="#f0f4f9" /><rect x="101" y="473" width="27.84" height="12" rx="3" fill="#cbd7e8" /><text x="292" y="484" font-size="17" fill="#61798d" font-weight="400" text-anchor="start">16%</text><rect x="101" y="494" width="174" height="12" rx="3" fill="#f0f4f9" /><rect x="101" y="494" width="12.37" height="12" rx="3" fill="#237ac7" /><text x="292" y="506" font-size="17" fill="#237ac7" font-weight="600" text-anchor="start">7.1%</text><text x="72" y="561" font-size="19" fill="#19354e" font-weight="600" text-anchor="start">D</text><rect x="101" y="543" width="174" height="12" rx="3" fill="#f0f4f9" /><rect x="101" y="543" width="13.92" height="12" rx="3" fill="#cbd7e8" /><text x="292" y="554" font-size="17" fill="#61798d" font-weight="400" text-anchor="start">8%</text><rect x="101" y="564" width="174" height="12" rx="3" fill="#f0f4f9" /><rect x="101" y="564" width="3.09" height="12" rx="3" fill="#237ac7" /><text x="292" y="576" font-size="17" fill="#237ac7" font-weight="600" text-anchor="start">1.8%</text><text x="72" y="659" font-size="19" fill="#19354e" font-weight="600" text-anchor="start">高分候选的相对优势增强</text><text x="72" y="690" font-size="17" fill="#61798d" font-weight="400" text-anchor="start">不等于事实准确率提高</text><g transform="translate(-376 0)"><rect x="800" y="150" width="352" height="566" rx="20" fill="white" filter="url(#shadow)" /><rect x="824" y="176" width="44" height="5" rx="2" fill="#cf8a25" /><text x="824" y="220" font-size="26" fill="#19354e" font-weight="650" text-anchor="start">Top-P = 0.9</text><text x="824" y="255" font-size="20" fill="#61798d" font-weight="400" text-anchor="start">动态覆盖概率质量</text><rect x="824" y="313" width="304" height="54" rx="10" fill="#fff4df" /><text x="843" y="347" font-size="22" fill="#cf8a25" font-weight="650" text-anchor="start">A</text><text x="891" y="347" font-size="22" fill="#cf8a25" font-weight="600" text-anchor="start">52%</text><text x="1104" y="347" font-size="18" fill="#cf8a25" font-weight="500" text-anchor="end">保留</text><rect x="824" y="382" width="304" height="54" rx="10" fill="#fff4df" /><text x="843" y="416" font-size="22" fill="#cf8a25" font-weight="650" text-anchor="start">B</text><text x="891" y="416" font-size="22" fill="#cf8a25" font-weight="600" text-anchor="start">24%</text><text x="1104" y="416" font-size="18" fill="#cf8a25" font-weight="500" text-anchor="end">保留</text><rect x="824" y="451" width="304" height="54" rx="10" fill="#fff4df" /><text x="843" y="485" font-size="22" fill="#cf8a25" font-weight="650" text-anchor="start">C</text><text x="891" y="485" font-size="22" fill="#cf8a25" font-weight="600" text-anchor="start">16%</text><text x="1104" y="485" font-size="18" fill="#cf8a25" font-weight="500" text-anchor="end">保留</text><rect x="824" y="520" width="304" height="54" rx="10" fill="#f3f6fa" /><text x="843" y="554" font-size="22" fill="#9aaaba" font-weight="650" text-anchor="start">D</text><text x="891" y="554" font-size="22" fill="#9aaaba" font-weight="600" text-anchor="start">8%</text><text x="1104" y="554" font-size="18" fill="#9aaaba" font-weight="500" text-anchor="end">排除</text><text x="824" y="638" font-size="21" fill="#19354e" font-weight="650" text-anchor="start">保留 A、B、C</text><text x="824" y="670" font-size="18" fill="#61798d" font-weight="400" text-anchor="start">76% 不足 90%，加入 C 达 92%</text></g><g transform="translate(376 0)"><rect x="424" y="150" width="352" height="566" rx="20" fill="white" filter="url(#shadow)" /><rect x="448" y="176" width="44" height="5" rx="2" fill="#0b9484" /><text x="448" y="220" font-size="26" fill="#19354e" font-weight="650" text-anchor="start">Top-K = 2</text><text x="448" y="255" font-size="20" fill="#61798d" font-weight="400" text-anchor="start">固定候选数量</text><rect x="448" y="313" width="304" height="54" rx="10" fill="#e8f7f3" /><text x="467" y="347" font-size="22" fill="#0b9484" font-weight="650" text-anchor="start">A</text><text x="515" y="347" font-size="22" fill="#0b9484" font-weight="600" text-anchor="start">52%</text><text x="728" y="347" font-size="18" fill="#0b9484" font-weight="500" text-anchor="end">保留</text><rect x="448" y="382" width="304" height="54" rx="10" fill="#e8f7f3" /><text x="467" y="416" font-size="22" fill="#0b9484" font-weight="650" text-anchor="start">B</text><text x="515" y="416" font-size="22" fill="#0b9484" font-weight="600" text-anchor="start">24%</text><text x="728" y="416" font-size="18" fill="#0b9484" font-weight="500" text-anchor="end">保留</text><rect x="448" y="451" width="304" height="54" rx="10" fill="#f3f6fa" /><text x="467" y="485" font-size="22" fill="#9aaaba" font-weight="650" text-anchor="start">C</text><text x="515" y="485" font-size="22" fill="#9aaaba" font-weight="600" text-anchor="start">16%</text><text x="728" y="485" font-size="18" fill="#9aaaba" font-weight="500" text-anchor="end">排除</text><rect x="448" y="520" width="304" height="54" rx="10" fill="#f3f6fa" /><text x="467" y="554" font-size="22" fill="#9aaaba" font-weight="650" text-anchor="start">D</text><text x="515" y="554" font-size="22" fill="#9aaaba" font-weight="600" text-anchor="start">8%</text><text x="728" y="554" font-size="18" fill="#9aaaba" font-weight="500" text-anchor="end">排除</text><text x="448" y="638" font-size="21" fill="#19354e" font-weight="650" text-anchor="start">保留 A、B</text><text x="448" y="670" font-size="18" fill="#61798d" font-weight="400" text-anchor="start">累计概率 76%</text></g><rect x="48" y="745" width="1104" height="93" rx="18" fill="#e6eff9" /><text x="72" y="781" font-size="19" fill="#19354e" font-weight="400" text-anchor="start">Top-P 与 Top-K 面板独立使用基准分布；保留候选后重新归一化采样。</text><text x="72" y="815" font-size="18" fill="#61798d" font-weight="400" text-anchor="start">概率仅用于说明原理；多参数的执行顺序与支持范围以实际推理服务为准。</text></g></svg>