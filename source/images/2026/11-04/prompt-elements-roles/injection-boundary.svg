<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1540" viewBox="0 0 1440 1540" role="img" aria-labelledby="title desc"><title id="title">提示词注入的分层防御与执行边界</title><desc id="desc">受控规则与用户任务按消息角色进入模型。外部内容经来源和访问范围检查、注入检测与脱敏后作为数据进入模型。模型的工具请求须经服务端授权、参数校验和必要审批，通过后才执行；工具结果经同一内容检查回传模型。最终回答经输出检查后交付用户。最小权限、凭据隔离和监控审计贯穿流程，检测不能替代授权。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fafcff"/><stop offset="1" stop-color="#edf4fb"/></linearGradient><filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#234363" flood-opacity=".07"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#6c8aa5" stroke-width="1.6"/></marker></defs><rect width="1440" height="1540" rx="28" fill="url(#bg)"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="80" fill="#18334f" font-size="40" font-weight="700" text-anchor="start">提示词注入的分层防御与执行边界</text><text x="60" y="128" fill="#698098" font-size="23" font-weight="400" text-anchor="start">外部内容与工具结果按数据处理；授权、参数校验与输出检查由应用落实。</text><g id="instructions" data-node="instructions"><rect x="60" y="205" width="360" height="190" rx="22" fill="#edf4ff" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="85" y="251" fill="#397ad1" font-size="28" font-weight="700" text-anchor="start">受控规则与用户任务</text><text x="85" y="293" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">应用规则由服务端管理</text><text x="85" y="326" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">用户需求保留原有消息角色</text><text x="85" y="359" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">分别组装，不混入外部指令</text></g><g id="model" data-node="model"><rect x="540" y="205" width="360" height="190" rx="22" fill="#f2edff" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="565" y="251" fill="#7c63bb" font-size="28" font-weight="700" text-anchor="start">模型</text><text x="565" y="293" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">理解任务与分析证据</text><text x="565" y="326" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">生成回答或提出工具请求</text><text x="565" y="359" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">不自行决定真实访问权限</text></g><g id="output-check" data-node="output-check"><rect x="1020" y="205" width="360" height="190" rx="22" fill="#eaf8f3" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="1045" y="251" fill="#188d83" font-size="28" font-weight="700" text-anchor="start">回答输出检查</text><text x="1045" y="293" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">结构与业务语义检查</text><text x="1045" y="326" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">敏感信息与外发目标检查</text><text x="1045" y="359" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">未通过：拦截或修订</text></g><path data-from="instructions" data-to="model" d="M420 300 L535 300" fill="none" stroke="#829cb3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="276" fill="#698098" font-size="19" font-weight="400" text-anchor="middle">按角色传入</text><path data-from="model" data-to="output-check" d="M900 285 L1015 285" fill="none" stroke="#829cb3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="960" y="260" fill="#698098" font-size="20" font-weight="400" text-anchor="middle">生成回答</text><g id="external" data-node="external"><rect x="60" y="535" width="360" height="190" rx="22" fill="#fff1ee" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="85" y="581" fill="#bc5865" font-size="28" font-weight="700" text-anchor="start">外部内容</text><text x="85" y="623" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">RAG / 网页 / 文档 / 日志</text><text x="85" y="656" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">可能含恶意指令或敏感信息</text><text x="85" y="689" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">不直接提升为应用规则</text></g><g id="content-check" data-node="content-check"><rect x="540" y="535" width="360" height="190" rx="22" fill="#eaf8f3" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="565" y="581" fill="#188d83" font-size="28" font-weight="700" text-anchor="start">来源与内容检查</text><text x="565" y="623" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">来源与资源访问范围检查</text><text x="565" y="656" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">注入检测与必要脱敏</text><text x="565" y="689" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">检测通过不代表没有攻击</text></g><g id="user-output" data-node="user-output"><rect x="1020" y="535" width="360" height="190" rx="22" fill="#edf4ff" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="1045" y="581" fill="#397ad1" font-size="28" font-weight="700" text-anchor="start">交付用户</text><text x="1045" y="623" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">仅交付检查通过的回答</text><text x="1045" y="656" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">避免通过文本、链接或图片</text><text x="1045" y="689" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">形成敏感信息外泄通道</text></g><path data-from="external" data-to="content-check" d="M420 630 L535 630" fill="none" stroke="#829cb3" stroke-width="2.5" marker-end="url(#arrow)"/><path data-from="content-check" data-to="model" d="M660 535 L660 400" fill="none" stroke="#829cb3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="682" y="477" fill="#188d83" font-size="22" font-weight="600" text-anchor="start">仅作为数据</text><path data-from="output-check" data-to="user-output" d="M1200 395 L1200 530" fill="none" stroke="#829cb3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1220" y="477" fill="#188d83" font-size="21" font-weight="600" text-anchor="start">检查通过</text><path data-from="model" data-to="tool-authorization" d="M840 395 L840 440 L950 440 L950 945 L1015 945" fill="none" stroke="#829cb3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="974" y="790" fill="#698098" font-size="21" font-weight="400" text-anchor="start">工具请求</text><g id="tool-authorization" data-node="tool-authorization"><rect x="1020" y="850" width="360" height="225" rx="22" fill="#eaf8f3" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="1045" y="896" fill="#188d83" font-size="28" font-weight="700" text-anchor="start">服务端执行校验</text><text x="1045" y="938" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">当前用户 / 租户 / 资源授权</text><text x="1045" y="971" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">工具白名单与业务参数校验</text><text x="1045" y="1004" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">敏感操作核验对应审批</text></g><rect x="1044" y="1030" width="312" height="30" rx="9" fill="#fcebed" stroke="#fcebed" stroke-width="1.5" filter="url(#shadow)"/><text x="1200" y="1052" fill="#bc5865" font-size="20" font-weight="600" text-anchor="middle">未通过：拒绝执行</text><g id="tool" data-node="tool"><rect x="1020" y="1160" width="360" height="190" rx="22" fill="#edf4ff" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="1045" y="1206" fill="#397ad1" font-size="28" font-weight="700" text-anchor="start">执行受控工具</text><text x="1045" y="1248" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">仅执行已通过校验的操作</text><text x="1045" y="1281" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">使用受限凭据与资源范围</text><text x="1045" y="1314" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">保留成功或失败的真实状态</text></g><path data-from="tool-authorization" data-to="tool" d="M1200 1075 L1200 1155" fill="none" stroke="#829cb3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1220" y="1128" fill="#188d83" font-size="21" font-weight="600" text-anchor="start">校验通过</text><g id="tool-result" data-node="tool-result"><rect x="540" y="1160" width="360" height="190" rx="22" fill="#fff5e5" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="565" y="1206" fill="#b07b28" font-size="28" font-weight="700" text-anchor="start">工具结果（数据）</text><text x="565" y="1248" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">关联原始调用与来源</text><text x="565" y="1281" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">保留必要结果及错误状态</text><text x="565" y="1314" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">其中的文字不获得指令权限</text></g><path data-from="tool" data-to="tool-result" d="M1020 1255 L905 1255" fill="none" stroke="#829cb3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="960" y="1227" fill="#698098" font-size="20" font-weight="400" text-anchor="middle">返回结果</text><path data-from="tool-result" data-to="content-check" d="M720 1160 L720 730" fill="none" stroke="#829cb3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="743" y="925" fill="#188d83" font-size="22" font-weight="600" text-anchor="start">回传模型前</text><text x="743" y="960" fill="#188d83" font-size="22" font-weight="600" text-anchor="start">再次检查</text><g id="cross-cutting-controls"><rect x="60" y="850" width="360" height="500" rx="22" fill="#fff" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="87" y="900" fill="#18334f" font-size="27" font-weight="700" text-anchor="start">贯穿流程的控制</text><text x="87" y="954" fill="#397ad1" font-size="24" font-weight="700" text-anchor="start">最小权限</text><text x="87" y="989" fill="#3f5873" font-size="20" font-weight="400" text-anchor="start">RBAC / ABAC 与工具白名单</text><text x="87" y="1018" fill="#3f5873" font-size="20" font-weight="400" text-anchor="start">限制数据、操作和网络范围</text><text x="87" y="1084" fill="#188d83" font-size="24" font-weight="700" text-anchor="start">凭据与敏感信息隔离</text><text x="87" y="1119" fill="#3f5873" font-size="20" font-weight="400" text-anchor="start">密钥由工具侧使用</text><text x="87" y="1148" fill="#3f5873" font-size="20" font-weight="400" text-anchor="start">不进入模型上下文与日志</text><text x="87" y="1214" fill="#7c63bb" font-size="24" font-weight="700" text-anchor="start">监控、审计与回归</text><text x="87" y="1249" fill="#3f5873" font-size="20" font-weight="400" text-anchor="start">记录脱敏 Trace 与授权决策</text><text x="87" y="1278" fill="#3f5873" font-size="20" font-weight="400" text-anchor="start">持续测试注入与越权场景</text></g><rect x="60" y="1400" width="1320" height="96" rx="15" fill="#e7eff7" stroke="#e7eff7" stroke-width="1.5" filter="url(#shadow)"/><text x="90" y="1439" fill="#18334f" font-size="25" font-weight="600" text-anchor="start">检测用于识别风险，授权用于限制执行；任何一层都不能单独保证安全。</text><text x="90" y="1477" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">本图为概念流程：即使模型误信外部内容，程序仍应阻断越权操作与敏感信息外泄。</text></g></svg>