<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc"><title id="title">工具调用：模型提议，应用校验与执行</title><desc id="desc">用户任务经过认证与规则组装，模型提出工具请求，服务端校验通过后执行工具并将结果回传。校验不通过则拒绝执行。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fafcff"/><stop offset="1" stop-color="#edf4fb"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#234363" flood-opacity=".07"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#6c8aa5" stroke-width="1.6"/></marker></defs><rect width="1440" height="980" rx="28" fill="url(#bg)"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="82" fill="#18334f" font-size="44" font-weight="700" text-anchor="start">工具调用：模型提议，应用校验与执行</text><text x="60" y="130" fill="#698098" font-size="23" font-weight="400" text-anchor="start">概念流程；工具协议与消息角色由目标 API 和 Formatter 适配。</text><rect x="60" y="215" width="400" height="165" rx="22" fill="#edf4ff" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="85" y="252" fill="#397ad1" font-size="22" font-weight="700" text-anchor="start">01</text><text x="85" y="295" fill="#18334f" font-size="28" font-weight="700" text-anchor="start">用户任务</text><text x="85" y="332" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">问题与待分析材料</text><text x="85" y="362" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">用户内容不改变应用规则</text><rect x="520" y="215" width="400" height="165" rx="22" fill="#eaf8f3" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="545" y="252" fill="#188d83" font-size="22" font-weight="700" text-anchor="start">02</text><text x="545" y="295" fill="#18334f" font-size="28" font-weight="700" text-anchor="start">Spring Boot</text><text x="545" y="332" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">身份认证与资源范围检查</text><text x="545" y="362" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">组装受控规则和当前任务</text><rect x="980" y="215" width="400" height="165" rx="22" fill="#f2edff" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="1005" y="252" fill="#7c63bb" font-size="22" font-weight="700" text-anchor="start">03</text><text x="1005" y="295" fill="#18334f" font-size="28" font-weight="700" text-anchor="start">AgentScope / 模型</text><text x="1005" y="332" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">组织模型与工具流程</text><text x="1005" y="362" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">提出结构化调用请求</text><rect x="980" y="520" width="400" height="165" rx="22" fill="#eaf8f3" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="1005" y="557" fill="#188d83" font-size="22" font-weight="700" text-anchor="start">04</text><text x="1005" y="600" fill="#18334f" font-size="28" font-weight="700" text-anchor="start">工具执行校验</text><text x="1005" y="637" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">核对身份、范围与参数</text><text x="1005" y="667" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">执行前由服务端独立判断</text><rect x="520" y="520" width="400" height="165" rx="22" fill="#edf4ff" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="545" y="557" fill="#397ad1" font-size="22" font-weight="700" text-anchor="start">05</text><text x="545" y="600" fill="#18334f" font-size="28" font-weight="700" text-anchor="start">只读工具执行</text><text x="545" y="637" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">查询日志与排障文档</text><text x="545" y="667" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">保留调用关联和错误状态</text><rect x="60" y="520" width="400" height="165" rx="22" fill="#f2edff" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="85" y="557" fill="#7c63bb" font-size="22" font-weight="700" text-anchor="start">06</text><text x="85" y="600" fill="#18334f" font-size="28" font-weight="700" text-anchor="start">回答与结果校验</text><text x="85" y="637" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">模型基于工具结果回答</text><text x="85" y="667" fill="#3f5873" font-size="22" font-weight="400" text-anchor="start">校验结构、证据和敏感信息</text><path d="M460 298 L515 298" fill="none" stroke="#8ba3b8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M920 298 L975 298" fill="none" stroke="#8ba3b8" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M1180 380 L1180 515" fill="none" stroke="#8ba3b8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="1200" y="456" fill="#698098" font-size="22" font-weight="400" text-anchor="start">调用请求</text><path d="M980 600 L925 600" fill="none" stroke="#8ba3b8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="950" y="573" fill="#188d83" font-size="21" font-weight="600" text-anchor="middle">通过</text><path d="M520 600 L465 600" fill="none" stroke="#8ba3b8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="490" y="573" fill="#698098" font-size="21" font-weight="400" text-anchor="middle">回传</text><rect x="980" y="790" width="400" height="110" rx="22" fill="#fff1ee" stroke="#efcec6" stroke-width="1.5" filter="url(#shadow)"/><text x="1180" y="835" fill="#bc5865" font-size="28" font-weight="700" text-anchor="middle">拒绝执行</text><text x="1180" y="874" fill="#3f5873" font-size="22" font-weight="400" text-anchor="middle">不满足权限或参数规则</text><path d="M1180 685 L1180 785" fill="none" stroke="#8ba3b8" stroke-width="2.4" marker-end="url(#arrow)"/><text x="1200" y="747" fill="#bc5865" font-size="22" font-weight="600" text-anchor="start">未通过</text><rect x="60" y="755" width="860" height="145" rx="22" fill="#fff" stroke="#d7e3ee" stroke-width="1.5" filter="url(#shadow)"/><text x="88" y="805" fill="#18334f" font-size="28" font-weight="700" text-anchor="start">调用请求 ≠ 执行授权</text><text x="88" y="849" fill="#3f5873" font-size="23" font-weight="400" text-anchor="start">工具返回的是数据与证据，不能自行扩大权限。</text><text x="88" y="882" fill="#698098" font-size="22" font-weight="400" text-anchor="start">模型提出操作后，应用仍需独立校验并记录执行结果。</text></g></svg>