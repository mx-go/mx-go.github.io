<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1170" viewBox="0 0 1280 1170" role="img" aria-labelledby="title desc"><title id="title">幻觉治理：事前预防、事中约束、事后校验与安全降级</title><desc id="desc">Input 明确回答范围并检查知识源，Process 通过检索和工具补充证据，Output 核查候选答案。通过后交付，未通过则有限修复并重新校验，或安全降级。任何阶段依据不足都可暂停或降级。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#edf4fb"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#7894ad" stroke-width="1.7"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#32947d" stroke-width="1.7"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#be6d76" stroke-width="1.7"/></marker></defs><rect width="1280" height="1170" rx="26" fill="url(#bg)"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="64" y="70" fill="#193750" font-size="37" font-weight="700">幻觉治理：预防、约束、校验与降级</text><text x="64" y="116" fill="#627d95" font-size="22">输入前明确边界，生成时依赖证据，交付前核验；证据不足时安全降级。</text><rect x="64" y="162" width="1152" height="170" rx="20" fill="#edf5ff" stroke="#427cc1" stroke-opacity=".22"/><text x="96" y="201" fill="#427cc1" font-size="22" font-weight="700">INPUT</text><text x="96" y="247" fill="#24415a" font-size="31" font-weight="700">事前预防</text><text x="96" y="287" fill="#427cc1" font-size="21">提前减少信息缺口</text><path d="M380 190 V304" stroke="#427cc1" stroke-opacity=".2"/><text x="420" y="208" fill="#294962" font-size="23" font-weight="600">Prompt 约束 · 可靠知识源 · 上下文检查</text><text x="420" y="253" fill="#526f88" font-size="21">核对文档版本与适用范围，明确无答案时如何处理。</text><text x="420" y="296" fill="#6a8094" font-size="19">边界：提示词是行为约束，不能保证模型完全遵守。</text><rect x="64" y="392" width="1152" height="170" rx="20" fill="#edf8f4" stroke="#288d79" stroke-opacity=".22"/><text x="96" y="431" fill="#288d79" font-size="22" font-weight="700">PROCESS</text><text x="96" y="477" fill="#24415a" font-size="31" font-weight="700">事中约束</text><text x="96" y="517" fill="#288d79" font-size="21">以证据约束生成</text><path d="M380 420 V534" stroke="#288d79" stroke-opacity=".2"/><text x="420" y="438" fill="#294962" font-size="23" font-weight="600">RAG 检索 · Tool Calling · 证据交叉验证</text><text x="420" y="483" fill="#526f88" font-size="21">查询实际业务状态，由程序完成关键计算并处理冲突。</text><text x="420" y="526" fill="#6a8094" font-size="19">边界：工具可能异常，多模型意见一致也不等于事实正确。</text><rect x="64" y="622" width="1152" height="170" rx="20" fill="#fff4e8" stroke="#b77c35" stroke-opacity=".22"/><text x="96" y="661" fill="#b77c35" font-size="22" font-weight="700">OUTPUT</text><text x="96" y="707" fill="#24415a" font-size="31" font-weight="700">事后校验</text><text x="96" y="747" fill="#b77c35" font-size="21">检查候选答案再交付</text><path d="M380 650 V764" stroke="#b77c35" stroke-opacity=".2"/><text x="420" y="668" fill="#294962" font-size="23" font-weight="600">Schema · 证据支持度 · 事实与业务规则校验</text><text x="420" y="713" fill="#526f88" font-size="21">核查关键断言、数字与状态，识别不一致或无依据的结论。</text><text x="420" y="756" fill="#6a8094" font-size="19">边界：结构合规或证据支持，都不能单独证明事实正确。</text><path d="M640 342 V382" fill="none" stroke="#7894ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M640 572 V612" fill="none" stroke="#7894ad" stroke-width="3" marker-end="url(#arrow)"/><path d="M640 802 V844" stroke="#7894ad" stroke-width="3"/><path d="M640 844 H324 V878" fill="none" stroke="#32947d" stroke-width="3" marker-end="url(#green)"/><path d="M640 844 H956 V878" fill="none" stroke="#be6d76" stroke-width="3" marker-end="url(#red)"/>
<rect x="64" y="892" width="520" height="118" rx="17" fill="#e7f5ee" stroke="#c4e1d1"/><text x="90" y="930" fill="#2d806a" font-size="26" font-weight="700">通过：返回已核验答案</text><text x="90" y="965" fill="#56796b" font-size="20">保留来源与必要的适用条件</text><text x="90" y="992" fill="#56796b" font-size="19">对外发送前完成相应内容与隐私检查</text>
<rect x="696" y="892" width="520" height="118" rx="17" fill="#fceff0" stroke="#edcfd3"/><text x="722" y="930" fill="#ad616a" font-size="25" font-weight="700">未通过：有限修复或安全降级</text><text x="722" y="965" fill="#97737a" font-size="19">补充查询、修复后重新校验；仍无法确认时</text><text x="722" y="992" fill="#97737a" font-size="19">返回可确认部分 / 澄清 / 拒答 / 人工复核</text>
<rect x="64" y="1042" width="1152" height="88" rx="16" fill="#e1ebf5"/><text x="640" y="1077" text-anchor="middle" fill="#2c4c66" font-size="22" font-weight="600">Input、Process 侧重减少错误；Output 侧重识别并处理已生成的错误。</text><text x="640" y="1110" text-anchor="middle" fill="#617b94" font-size="20">安全降级适用于任一阶段；修复应有预算上限，不能无限重试。</text></g></svg>