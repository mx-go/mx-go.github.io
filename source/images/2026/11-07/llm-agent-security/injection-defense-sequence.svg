<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc"><title id="title">从工具提议到实际执行</title><desc id="desc">模型提出工具请求，可信工具网关独立校验。拒绝分支不调用业务系统，允许分支在授权与必要审批有效后执行，并回填真实状态。两条分支互斥，最终答复仍需验证。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#edf4fb"/></linearGradient><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#477fc4" stroke-width="1.8"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#208f7e" stroke-width="1.8"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#c2656f" stroke-width="1.8"/></marker></defs><rect width="1200" height="1080" rx="26" fill="url(#bg)"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="66" fill="#193750" font-size="38" font-weight="700">从工具提议到实际执行</text><text x="48" y="107" fill="#607c95" font-size="22">模型负责提议，后端独立决策；校验结果决定拒绝或执行，两条分支互斥。</text><rect x="60" y="150" width="300" height="88" rx="17" fill="#eaf3ff" stroke="#3f78bc" stroke-opacity=".18"/><text x="210" y="189" text-anchor="middle" fill="#3f78bc" font-size="28" font-weight="700">模型与编排器</text><text x="210" y="220" text-anchor="middle" fill="#5d7690" font-size="19">生成工具提议，接收实际结果</text><rect x="450" y="150" width="300" height="88" rx="17" fill="#e8f7f2" stroke="#228673" stroke-opacity=".18"/><text x="600" y="189" text-anchor="middle" fill="#228673" font-size="28" font-weight="700">可信工具网关</text><text x="600" y="220" text-anchor="middle" fill="#5d7690" font-size="19">执行前强制授权与参数校验</text><rect x="840" y="150" width="300" height="88" rx="17" fill="#f2edfb" stroke="#8064b3" stroke-opacity=".18"/><text x="990" y="189" text-anchor="middle" fill="#8064b3" font-size="28" font-weight="700">业务系统</text><text x="990" y="220" text-anchor="middle" fill="#5d7690" font-size="19">限权操作，返回真实执行状态</text><path d="M210 242 V946" stroke="#bccddc" stroke-width="2" stroke-dasharray="5 8"/><path d="M600 242 V946" stroke="#bccddc" stroke-width="2" stroke-dasharray="5 8"/><path d="M990 242 V946" stroke="#bccddc" stroke-width="2" stroke-dasharray="5 8"/><path d="M210 292 H600" fill="none" stroke="#477fc4" stroke-width="2.5" marker-end="url(#blue)"/><text x="405.0" y="275" text-anchor="middle" fill="#477fc4" font-size="20" font-weight="600">① 提出请求，不携带执行权限</text><rect x="430" y="334" width="340" height="122" rx="16" fill="#fff" stroke="#b9dfd3"/><text x="600" y="370" text-anchor="middle" fill="#237e6d" font-size="25" font-weight="700">② 独立校验</text><text x="600" y="403" text-anchor="middle" fill="#4e6d84" font-size="21">真实身份 · 租户 · 资源权限</text><text x="600" y="433" text-anchor="middle" fill="#4e6d84" font-size="21">业务参数 · 必要审批 · 预算</text>
<rect x="60" y="486" width="1080" height="163" rx="18" fill="#fff0f0" fill-opacity=".95" stroke="#efd1d4"/><text x="82" y="519" fill="#b45e68" font-size="23" font-weight="700">拒绝分支</text><path d="M600 574 H210" fill="none" stroke="#c2656f" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#red)"/><text x="405.0" y="557" text-anchor="middle" fill="#c2656f" font-size="20" font-weight="600">越权、参数非法或审批无效</text><rect x="839" y="535" width="280" height="70" rx="13" fill="#fff"/><text x="979" y="578" text-anchor="middle" fill="#b45e68" font-size="24" font-weight="600">业务系统未被调用</text><text x="82" y="626" fill="#a4777e" font-size="19">记录拒绝原因，回填受控失败状态。</text>
<rect x="60" y="675" width="1080" height="271" rx="18" fill="#ebf8f3" fill-opacity=".95" stroke="#c6e5d8"/><text x="82" y="708" fill="#248674" font-size="23" font-weight="700">允许分支</text><path d="M600 758 H990" fill="none" stroke="#208f7e" stroke-width="2.5" marker-end="url(#green)"/><text x="795.0" y="741" text-anchor="middle" fill="#208f7e" font-size="20" font-weight="600">③ 授权及必要审批有效后执行</text><path d="M990 829 H600" fill="none" stroke="#208f7e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#green)"/><text x="795.0" y="812" text-anchor="middle" fill="#208f7e" font-size="20" font-weight="600">④ 返回实际状态：成功 / 失败 / 未知</text><path d="M600 900 H210" fill="none" stroke="#477fc4" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#blue)"/><text x="405.0" y="883" text-anchor="middle" fill="#477fc4" font-size="20" font-weight="600">⑤ 结构化回填，最终答复仍需验证</text><rect x="60" y="981" width="1080" height="65" rx="15" fill="#e1ebf5"/><text x="88" y="1022" fill="#294a65" font-size="24" font-weight="600">工具提议 ≠ 执行授权　　格式合法 ≠ 业务合法　　超时 ≠ 操作未发生</text></g></svg>